# Merge with docker-compose.yml. Host Ollama remains outside Docker.
services:
  migrate:
    build: ../backend
    environment: &app-env
      DATABASE_URL: postgresql+psycopg://app:${POSTGRES_PASSWORD:-app_password}@postgres:5432/social_content
      REDIS_URL: redis://redis:6379/0
      CELERY_BROKER_URL: redis://redis:6379/1
      OLLAMA_BASE_URL: http://host.docker.internal:11434
      OLLAMA_MODEL: ${OLLAMA_MODEL:-qwen3.5:4b}
      OLLAMA_VISION_MODEL: ${OLLAMA_VISION_MODEL:-qwen3.5:4b}
      GENERATION_MODE: ${GENERATION_MODE:-ollama}
      LOCAL_STORAGE_PATH: /storage
      FRONTEND_ORIGIN: ${FRONTEND_ORIGIN:-http://localhost:3000}
    command: ["alembic", "upgrade", "head"]
    depends_on:
      postgres:
        condition: service_healthy
  api:
    build: ../backend
    environment: *app-env
    volumes:
      - media:/storage
    ports:
      - "127.0.0.1:8000:8000"
    depends_on:
      migrate:
        condition: service_completed_successfully
      redis:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://localhost:8000/api/v1/health', timeout=3)"]
      interval: 15s
      timeout: 5s
      retries: 3
  worker:
    build: ../backend
    environment: *app-env
    command: ["celery", "-A", "app.workers.celery_app:celery_app", "worker", "--concurrency=1", "--loglevel=INFO"]
    volumes:
      - media:/storage
    depends_on:
      migrate:
        condition: service_completed_successfully
      redis:
        condition: service_healthy
  scheduler:
    build: ../backend
    environment: *app-env
    command: ["celery", "-A", "app.workers.celery_app:celery_app", "beat", "--schedule=/storage/celerybeat-schedule", "--loglevel=INFO"]
    volumes:
      - media:/storage
    depends_on:
      migrate:
        condition: service_completed_successfully
      redis:
        condition: service_healthy
  frontend:
    build:
      context: ../frontend
      args:
        NEXT_PUBLIC_API_URL: ${NEXT_PUBLIC_API_URL:-http://localhost:8000}
    ports:
      - "127.0.0.1:3000:3000"
    depends_on:
      api:
        condition: service_started
volumes:
  media:
